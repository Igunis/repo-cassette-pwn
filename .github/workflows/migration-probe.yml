name: Probe artifact migration MIME

on:
  push:
    branches:
      - codex-cacheprobe

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/migration-probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
