name: Probe high-byte artifact MIME

on:
  push:
    branches:
      - codex-cacheprobe

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --no-save --package-lock=false @actions/artifact@6.3.1
      - uses: ./.github/actions/highbyte-mime
