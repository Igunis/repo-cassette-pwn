name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Write JSON summary carrier
        run: |
          printf '%s\n' '{"probe":"repo-cassette-summary"}' >> "$GITHUB_STEP_SUMMARY"
      - name: Check summary API routes
        run: node .github/actions/forge/probe-summary.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RUN_ID: 40173132909
