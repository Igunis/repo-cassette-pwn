name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install the artifact client
        run: npm install --no-save --package-lock=false @actions/artifact@6.3.1
      - name: Probe unfinalized artifact visibility
        uses: ./.github/actions/forge
        env:
          GH_TOKEN: ${{ github.token }}
