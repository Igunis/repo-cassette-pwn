name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install exact app GitHub client
        run: npm install --no-save --prefix .github/actions/forge gh-got@12.0.0
      - name: Compare raw and gh-got artifact headers
        run: node .github/actions/forge/probe-raw-headers.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
