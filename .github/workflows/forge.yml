name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Probe artifact MIME query parameters
        run: node .github/actions/forge/artifact-query-probe.mjs
        env:
          GH_TOKEN: ${{ github.token }}
