name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe release asset route and accepted media types
        run: python3 .github/actions/forge/probe-release-route.py
        env:
          GH_TOKEN: ${{ github.token }}
