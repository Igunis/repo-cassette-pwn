name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit ucan-ca solver run logs and public artifact types
        run: python3 .github/actions/forge/scan-ucan.py
        env:
          GH_TOKEN: ${{ github.token }}
