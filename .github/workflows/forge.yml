name: Forge Repo Cassette log

on:
  push:
    branches:
      - probe-artifact-redirect
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect completed Blob MIME and job log experiments
        run: python3 .github/actions/forge/probe-blob-and-preempt.py
        env:
          GH_TOKEN: ${{ github.token }}
