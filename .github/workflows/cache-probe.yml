name: Probe GitHub media cache

on:
  push:
    branches:
      - codex-cacheprobe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe API redirect and JSONP surfaces
        run: python3 api_redirect_probe.py
        env:
          GH_TOKEN: ${{ github.token }}
