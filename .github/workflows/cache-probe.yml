name: Probe GitHub media cache

on:
  push:
    branches:
      - codex-cacheprobe
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe v6 artifact metadata routes
        run: python3 v6_metadata_probe.py
        env:
          GH_TOKEN: ${{ github.token }}
