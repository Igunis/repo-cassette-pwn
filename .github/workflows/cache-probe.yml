name: Probe GitHub media cache

on:
  push:
    branches:
      - codex-cacheprobe
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install artifact client
        run: npm install --no-save --package-lock=false @actions/artifact@6.3.1
      - name: Recheck v7 NEL MIME registration
        run: node unicode_mime_probe.mjs
