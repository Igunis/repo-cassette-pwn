name: Probe GitHub media cache

on:
  push:
    branches:
      - codex-cacheprobe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe encoded artifact MIME
        uses: ./.github/actions/utf8-probe
        env:
          GH_TOKEN: ${{ github.token }}
